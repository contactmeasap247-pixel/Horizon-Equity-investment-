services:
  - type: web
    name: horizon-equity-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "True"
      - key: APP_NAME
        value: "Horizon Equity"
      - key: APP_VERSION
        value: "1.0.0"
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres:[REDACTED]@localhost:5432/postgres
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: ALLOWED_ORIGINS
        value: https://horizon-equity-investment.vercel.app,http://localhost:3000
      - key: VERCEL_FRONTEND_URL
        value: https://horizon-equity-investment.vercel.app
      - key: JWT_SECRET_KEY
        value: [REDACTED_JWT_SECRET]
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_EMAIL
        value: only-me@gmail.com
      - key: ADMIN_PASSWORD
        value: connect@me-alone
      - key: UPLOAD_DIR
        value: ./uploads
