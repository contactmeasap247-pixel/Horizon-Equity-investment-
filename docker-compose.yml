version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: horizon_postgres
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon123
      POSTGRES_DB: horizon_equity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - horizon_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: horizon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - horizon_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: horizon_backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://horizon:horizon123@postgres:5432/horizon_equity
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - horizon_network

  celery:
    build: ./backend
    container_name: horizon_celery
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://horizon:horizon123@postgres:5432/horizon_equity
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    networks:
      - horizon_network

  celery-beat:
    build: ./backend
    container_name: horizon_celery_beat
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://horizon:horizon123@postgres:5432/horizon_equity
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - horizon_network

  frontend:
    build: ./frontend
    container_name: horizon_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev
    networks:
      - horizon_network

  nginx:
    image: nginx:alpine
    container_name: horizon_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - horizon_network

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:

networks:
  horizon_network:
    driver: bridge
